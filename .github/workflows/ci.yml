name: CI-CD

on:
  push:
    branches:
      - main

jobs:

  ci:
    name: Build Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUBUSERNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Git SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            venkatasai2568/python-app:${{ steps.vars.outputs.sha_short }}
            venkatasai2568/python-app:latest

  cd:
    name: Deploy using ArgoCD
    needs: ci
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Image Tag
        run: |
          echo "Deploying Image Tag:"
          echo "${{ needs.ci.outputs.image_tag }}"

      - name: Update Helm values.yaml
        run: |
          sed -i 's/tag:.*/tag: ${{ needs.ci.outputs.image_tag }}/' charts/python-app/values.yaml

      - name: Commit Updated values.yaml
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git add charts/python-app/values.yaml

          git commit -m "Updated image tag to ${{ needs.ci.outputs.image_tag }}" || echo "No changes to commit"

          git push

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
          https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-arm64

          chmod +x argocd

          sudo mv argocd /usr/local/bin/

      - name: Verify ArgoCD CLI
        run: |
          argocd version --client

      - name: Login to ArgoCD
        run: |
          argocd login argocd-server.argocd.svc \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure

      - name: Sync ArgoCD App
        run: |
          argocd app sync python-app

      - name: Wait for Healthy State
        run: |
          argocd app wait python-app --health --timeout 300